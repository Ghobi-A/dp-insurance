name: LiRA real-data study validation

on:
  push:
    branches:
      - review/lira-artifact-integrity-20261116
  pull_request:
    branches:
      - claude/lira-real-data-validation
      - claude/dp-insurance-statistical-review-hvnxi4
      - main
    paths:
      - "research/lira_validation_report.py"
      - "reports/lira_validation/**"
      - "research/lira_real_data_study.py"
      - "src/dp/lira_study.py"
      - "tests/test_lira_study.py"
      - ".github/workflows/lira-study-validation.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[experimental,dev]"
      - name: Lint changed modules and tests
        run: |
          ruff check research/lira_real_data_study.py research/lira_validation_report.py src/dp/lira_study.py tests/test_lira_study.py
      - name: Run LiRA design and checkpoint tests
        run: |
          python -m pytest -q tests/test_attacks.py tests/test_lira_variance_simulation.py tests/test_lira_study.py
      - name: Validate committed study artefacts and regenerate the analysis
        run: |
          python research/lira_real_data_study.py inventory --input-dir reports/lira_validation/v1 --require-complete
          cp -r reports/lira_validation/v1 /tmp/lira_v1_check
          python research/lira_real_data_study.py analyse --input-dir /tmp/lira_v1_check
          python - <<'PY'
          import pandas as pd
          a = pd.read_csv("reports/lira_validation/v1/summary.csv")
          b = pd.read_csv("/tmp/lira_v1_check/summary.csv")
          pd.testing.assert_frame_equal(a, b, check_exact=False, rtol=1e-9, atol=1e-12)
          print("committed summary reproduced from committed measurements")
          PY
