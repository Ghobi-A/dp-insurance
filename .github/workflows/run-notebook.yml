name: Run Notebook & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install ruff
      run: pip install ruff
    - name: Ruff lint
      run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch keeps the install small; DP-SGD tests are skipped without it.
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[experimental,dev]"

    - name: Run tests with coverage
      run: python -m pytest tests/ --cov=dp --cov-report=xml --cov-report=term

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[experimental,dev]"
    - name: Lightweight benchmark smoke test (2 seeds, one epsilon)
      run: |
        python -m dp.benchmark --task all --seeds 0 1 --epsilons 2.0 \
          --output-dir smoke-results
    - name: Verify report files can be generated
      run: |
        python -m dp.reporting --results smoke-results --reports-dir smoke-reports
        test -f smoke-reports/benchmark_report.md
        test -f smoke-reports/tables/model_comparison.csv
        ls smoke-reports/figures/*.png
    - name: Upload smoke artifacts
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-smoke
        path: |
          smoke-results
          smoke-reports

  notebook:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[experimental,dev]"

    - name: Execute notebook
      run: jupyter nbconvert --to notebook --execute notebooks/dp_privacy_insurance.ipynb
