name: Run Notebook & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch keeps the install small; DP-SGD tests are skipped without it.
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[experimental,dev]"

    - name: Run tests with coverage
      run: python -m pytest tests/ --cov=dp --cov-report=xml --cov-report=term

  notebook:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[experimental,dev]"

    - name: Execute notebook
      run: jupyter nbconvert --to notebook --execute notebooks/dp_privacy_insurance.ipynb
